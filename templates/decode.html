{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Reveal a Message</h1>
    <form method="POST" enctype="multipart/form-data">
        <label>Encoded image (PNG only)</label>
        <input type="file" name="image" accept=".png" required>

        <button type="submit">Reveal Hidden Message</button>
    </form>

    {% if hidden_message %}
        <div class="result">
            <strong>Hidden message:</strong><br>
            {{ hidden_message }}
        </div>
    {% endif %}
</div>
{% endblock %}
